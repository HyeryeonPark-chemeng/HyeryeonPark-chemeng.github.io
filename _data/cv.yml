    RESEARCH EXPERIENCE:
      - date_range: Jul 2026 – Present
        title: Development of High-Impact-Resistant Pressure-Sensitive Adhesives via Shear Flow-Induced Nano-Alignment of Nanorods
        subtitle: Sponsored by Samsung Display Corporation
        subtitle_italic: true
        highlights:
          - Designed and conducted systematic studies of anisotropic nanoparticle morphology to elucidate shear-induced nanorod alignment in polymer resin formulations.
          - Optimized nanoparticle loading, resin viscosity, and blade/roll-to-roll coating parameters to balance optical transparency, haze, adhesion, and impact resistance.
      - date_range: Mar 2026 – Present
        title: High-Resolution Patterning of Ferromagnetic Particles in Organic Thin Films Using a Tunable Magnetic Polarity Array Based on the Magnetic Trapping Effect
        subtitle: Sponsored by the Ministry of Science and ICT (MSIT) of Korea
        subtitle_italic: true
        highlights:
          - Co-authored the research proposal and designed the particle surface-modification strategy, including particle selection and functional-group design, to enable magnetic trapping and patterning in organic thin films.
      - date_range: Nov 2025 – Present
        title: Spontaneous Surface-Rich Nanoparticle Segregation Technology Enabling Dual-Functional Overcoat Layer
        subtitle: Sponsored by Nissan Chemical Korea
        subtitle_italic: true
        highlights:
          - Developed nanoparticle-segregated overcoat films with a hard-surface/soft-bulk mechanical gradient by controlling spontaneous surface enrichment of surface-modified nanoparticles.
          - Quantified nanoparticle distribution and correlated segregation behavior with mechanical and optical performance using SEM/EDS, nanoindentation, ball-drop testing, and UV–Vis spectroscopy.
      - date_range: Sep 2025 – Aug 2026
        title: Development of Stretchable and Transparent Optical Films with Biomimetic Surface Patterns for Free-form Displays
        subtitle: Supported by the NRF Master’s Research Grant
        subtitle_italic: true
        highlights:
          - Designed and synthesized highly stretchable, transparent polyurethane acrylate (PUA) resin systems for bioinspired free-form display applications.
          - Investigated an inkjet-based micropatterning process for stretchable optical films, targeting an elongation of >600%, immediate strain recovery of >90%, and optical transmittance of >90%.
      - date_range: Jul 2024 – Present
        title: Development of Highly Durable Adhesive for Fuel Cell MEA and Reliability Evaluation Method
        subtitle: Sponsored by Hyundai Motor Group
        subtitle_italic: true
        highlights:
          - Designed and executed accelerated multi-stress degradation protocols to evaluate the long-term durability of polymeric sealing materials for fuel-cell MEAs.
          - Formulated and optimized adhesive resin systems and their rheological properties for jetting, screen printing, and spray-coating processes.
      - date_range: Jun 2024 – May 2025
        title: Development of New Impact-Resistant Coating Materials for Displays
        subtitle: Sponsored by Nissan Chemical Korea
        subtitle_italic: true
        highlights:
          - Designed and synthesized surface-functionalized nanoparticles and optimized nanocomposite resin formulations, achieving a 20% improvement in impact resistance for foldable-display optically clear adhesives (OCAs).
          - Established structure–property relationships through morphological, chemical, mechanical, optical, and thermal characterization; research outcomes contributed to a patent application and manuscript preparation.
