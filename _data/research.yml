    description: >-
      Studied anisotropic nanoparticle morphology to elucidate shear-induced nanorod alignment in polymer resin formulations. Optimized nanoparticle loading, resin viscosity, and blade/roll-to-roll coating parameters to balance optical transparency, haze, adhesion, and impact resistance.
