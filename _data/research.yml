projects:
  - title: Development of Surface-Segregated Nanocomposite Adhesives and Overcoat Films for Impact Resistance
    interest_anchor: particle-assembly
    id: surface-segregation-of-nanoparticles
    group: featured
    detail_background: ""
    detail_approach: ""
    detail_significance: ""
    detail_figures: []
    period: Jun 2024 – Present
    sponsor: Nissan Chemical Korea
    image: ""
    image_alt: ""
    description: >-
      Developed surface-functionalized nanoparticle/PSA systems with controlled surface segregation, achieving a 20% improvement in impact resistance and leading to a Korean patent application. Extended this strategy to overcoat films with a hard-surface/soft-bulk mechanical gradient through nanoparticle enrichment. Quantified nanoparticle distributions and correlated segregation behavior with mechanical and optical performance using SEM/EDS, nanoindentation, ball-drop testing, and UV–Vis spectroscopy.
    output_note: "Research output: Korean patent application filed (2026)"
    links: []
